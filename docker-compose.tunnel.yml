services:
  backend:
    environment:
      COOKIE_SECURE: "true"
  caddy:
    ports: !override
      - "127.0.0.1:${HTTP_PORT:-8080}:80"
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: ["tunnel", "--no-autoupdate", "--url", "http://caddy:80"]
    depends_on: [caddy]
    restart: "no"
