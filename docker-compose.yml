services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: csg_classroom
      POSTGRES_USER: csg
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - classroom-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U csg -d csg_classroom"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://csg:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/csg_classroom
      CLASS_CODE: ${CLASS_CODE:?Set CLASS_CODE in .env}
      ADDITIONAL_CLASS_CODES: ${ADDITIONAL_CLASS_CODES:-}
      INSTRUCTOR_PASSWORD: ${INSTRUCTOR_PASSWORD:?Set INSTRUCTOR_PASSWORD in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 60
      start_period: 30s
    restart: unless-stopped
  frontend:
    build: ./frontend
    environment:
      NODE_ENV: production
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
  caddy:
    image: caddy:2-alpine
    ports: ["${HTTP_PORT:-8080}:80"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-:80}
    depends_on: [frontend, backend]
    restart: unless-stopped
volumes:
  classroom-db:
  caddy-data:
  caddy-config:
